cription\\\x22\x3e\\n        Updates, news, and announcements. Edit their URLs in the configuration below.\\n      \x3c\\\/p\x3e\\n      \x3cdiv id\x3d\\\x22announcementsGrid\\\x22 class\x3d\\\x22grid\\\x22\x3e\x3c\\\/div\x3e\\n    \x3c\\\/section\x3e\\n\\n    \x3csection id\x3d\\\x22games\\\x22 class\x3d\\\x22page\\\x22\x3e\\n      \x3ch2 class\x3d\\\x22section-title\\\x22\x3e🎮 Game Stash\x3c\\\/h2\x3e\\n      \x3cp class\x3d\\\x22section-description\\\x22\x3e\\n        Choose a game to open its fetched HTML in a new about:blank tab.\\n      \x3c\\\/p\x3e\\n      \x3cdiv id\x3d\\\x22gamesGrid\\\x22 class\x3d\\\x22grid\\\x22\x3e\x3c\\\/div\x3e\\n    \x3c\\\/section\x3e\\n\\n    \x3csection id\x3d\\\x22chat\\\x22 class\x3d\\\x22page\\\x22\x3e\\n      \x3ch2 class\x3d\\\x22section-title\\\x22\x3e💬 Chat Room\x3c\\\/h2\x3e\\n      \x3cp class\x3d\\\x22section-description\\\x22\x3e\\n        Open your external chat or use the built-in shared chat below.\\n      \x3c\\\/p\x3e\\n\\n      \x3cdiv class\x3d\\\x22card\\\x22\x3e\\n        \x3ch3\x3eExternal Chat\x3c\\\/h3\x3e\\n        \x3cp\x3eThis chat is recommended! More customizable and responsive.\x3c\\\/p\x3e\\n        \x3cbutton class\x3d\\\x22button\\\x22 onclick\x3d\\\x22openConfiguredChat()\\\x22\x3eOpen External Chat\x3c\\\/button\x3e\\n      \x3c\\\/div\x3e\\n\\n      \x3cdiv class\x3d\\\x22card\\\x22 style\x3d\\\x22margin-top:18px\\\x22\x3e\\n        \x3ch3\x3eShared Website Chat \x3cspan id\x3d\\\x22adminBadge\\\x22 class\x3d\\\x22admin-badge\\\x22 style\x3d\\\x22display:none\\\x22\x3e🛡️ Admin\x3c\\\/span\x3e\x3c\\\/h3\x3e\\n        \x3cdiv id\x3d\\\x22chatStatus\\\x22 class\x3d\\\x22status\\\x22\x3eLoading messages...\x3c\\\/div\x3e\\n        \x3cdiv id\x3d\\\x22chatBox\\\x22 class\x3d\\\x22chat-box\\\x22 aria-live\x3d\\\x22polite\\\x22\x3e\x3c\\\/div\x3e\\n\\n        \x3cform id\x3d\\\x22chatForm\\\x22 novalidate\x3e\\n          \x3clabel for\x3d\\\x22chatName\\\x22\x3eYour name\x3c\\\/label\x3e\\n          \x3cinput id\x3d\\\x22chatName\\\x22 class\x3d\\\x22field\\\x22 maxlength\x3d\\\x2240\\\x22\\n                 placeholder\x3d\\\x22Enter your name\\\x22 required\x3e\\n\\n          \x3clabel for\x3d\\\x22chatMessage\\\x22\x3eMessage\x3c\\\/label\x3e\\n          \x3ctextarea id\x3d\\\x22chatMessage\\\x22 class\x3d\\\x22field\\\x22 maxlength\x3d\\\x221000\\\x22\\n                    placeholder\x3d\\\x22Write a message... (Enter to send, Shift+Enter for a new line)\\\x22 required\x3e\x3c\\\/textarea\x3e\\n\\n          \x3cbutton class\x3d\\\x22button\\\x22 type\x3d\\\x22submit\\\x22\x3eSend Message 🎃\x3c\\\/button\x3e\\n        \x3c\\\/form\x3e\\n      \x3c\\\/div\x3e\\n    \x3c\\\/section\x3e\\n\\n    \x3csection id\x3d\\\x22about\\\x22 class\x3d\\\x22page\\\x22\x3e\\n      \x3ch2 class\x3d\\\x22section-title\\\x22\x3e👻 About Ultra Game Stash\x3c\\\/h2\x3e\\n      \x3cdiv class\x3d\\\x22card\\\x22\x3e\\n        \x3ch3\x3eYour Halloween Gaming Hub\x3c\\\/h3\x3e\\n        \x3cp\x3e\\n          Ultra Game Stash V2 is a functional website that provides District 303 students with the ability to play a variety of video games. Some of the games are AI, and some are real!\\nUs as students, have discovered that finding games can become extremely difficult considering our district blocks everything, so we fixed this issue!\\nEvery single game on our website is completely functional and provides a fun experience for students.  Bored in class, no work, or just bored? Then come check out our game selection.\\nAlongside the games, we have a chatroom to engage with others from your district.\\nThank you for using Ultra Game Stash V2!\\n        \x3c\\\/p\x3e\\n      \x3c\\\/div\x3e\\n    \x3c\\\/section\x3e\\n\\n    \x3csection id\x3d\\\x22suggestions\\\x22 class\x3d\\\x22page\\\x22\x3e\\n      \x3ch2 class\x3d\\\x22section-title\\\x22\x3e💡 Suggestions\x3c\\\/h2\x3e\\n      \x3cp class\x3d\\\x22section-description\\\x22\x3e\\n        Have an idea for the website? Send it here.\\n
